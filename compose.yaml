services:
  shop:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:?Set the real HTTPS storefront origin in .env}
      DATA_DIR: /var/lib/technoimperiya
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      TRUST_PROXY: "1"
    volumes:
      - store-data:/var/lib/technoimperiya
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  store-data:
